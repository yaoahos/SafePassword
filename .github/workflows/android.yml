name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 不要沿用 action 的默认 packages（tools platform-tools）：
      # Google 已把独立的 "tools" 包从默认仓库移除，sdkmanager 会以
      # "Failed to find package 'tools'" 退出 1，整步直接失败。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Core tests and debug build
        run: ./gradlew :core:test :apps:android:assembleDebug --console=plain --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: SafePassword-debug
          path: apps/android/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 14
